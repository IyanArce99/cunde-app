<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none"
     stroke="currentColor" stroke-width="6" stroke-linecap="butt" stroke-linejoin="miter">
  <!-- Tres líneas de concepto y UNA tachada a mano con un garabato.
       La versión anterior llevaba un solo trazo diagonal, más grueso, que
       cruzaba las tres: a 52 px no se leía "esto no lo como" sino un ticket
       emborronado. El zigzag solo sobre la línea del medio dice dos cosas que
       el aspa no decía — que se tacha UNA, y que lo tacha una mano y no la
       impresora, porque una impresora térmica no dibuja garabatos. -->
